name: Clean runtime installation
on:
  pull_request:
  push:
    tags: ['*']
  workflow_dispatch:
jobs:
  clean-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/validate_clean_install.py dist/*.whl
